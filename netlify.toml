# Deploy do Hexacon na Netlify (SPA estática Vite)
[build]
  command = "npm run build"
  publish = "dist"

# fallback de SPA — qualquer rota cai no index.html (rotas /e/:slug, /painel, /turma/:id, /apresentar)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
